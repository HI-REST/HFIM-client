# Replica del barrido de Luis (2026-07-02) con el metodo determinista.
#
# Mismas 3 secciones + registros, misma n=500. Diferencias respecto al suyo:
#   - injection_pc_exclude quita el spin del UART del sorteo (reproducible)
#   - record_at_injection guarda testigos en el instante del disparo
#   - hooks.campaign_end clasifica las trayectorias (dano fisico real)
#
# Su semilla fue 12; usamos la misma para que la comparacion sea directa.
defaults:
  arch: riscv64
  seed: 12
  injections: 500
  workers: 8
  injection_mode: breakpoint
  fault_model: single_bit_flip

campaigns:
  - benchmark: robot_arm
    fault: memory
    section: .bss
    memory_access_size: 1
  - benchmark: robot_arm
    fault: memory
    section: .rodata
    memory_access_size: 1
  - benchmark: robot_arm
    fault: memory
    section: .text
    memory_access_size: 1
  - benchmark: robot_arm
    fault: register
